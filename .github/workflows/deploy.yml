# Builds the application and publishes it to GitHub Pages.
#
# Shape follows GitHub's own Pages template: one job, configure-pages before
# the upload, and the v5 actions. What it adds is the build — the template
# publishes the repository as-is, which for a Vite application would serve the
# source tree instead of the compiled site.
name: Deploy to Pages

# The github-pages environment only accepts deployments from the repository's
# DEFAULT branch. This repository was created empty, so the first branch pushed
# to it became the default — which is why deploying from main was rejected with
# "Branch main is not allowed to deploy to github-pages". Both branches are
# listed so the deployment keeps working before and after the default is moved
# to main; a push from whichever branch is not the default is simply rejected.
on:
  push:
    branches: [main, claude/clever-knuth-i5pzec]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # The playwright package fetches browsers in its install script; the
        # browser check runs locally, not here, so skip the download.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      - name: Physics checks
        run: npm run verify:engine

      - name: Type check and build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
